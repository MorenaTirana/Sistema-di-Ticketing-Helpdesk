<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Knowledge Base - Sistema di Ticketing / Helpdesk
    </title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <a class="brand" href="dashboard.html">
                <span class="brand-logo">TH</span>

                <span class="brand-text">
                    <strong>Ticketing Helpdesk</strong>
                    <small>Knowledge Base</small>
                </span>
            </a>

            <a
                class="button button-small"
                href="dashboard.html"
            >
                Dashboard
            </a>
        </div>
    </header>

    <main class="dashboard-main">
        <section class="dashboard-welcome">
            <p class="eyebrow">Assistenza</p>

            <h1>Articoli di supporto</h1>

            <p>
                Consulta le guide disponibili per i problemi
                più comuni.
            </p>
        </section>

        <section
            id="newArticleSection"
            class="auth-card ticket-form-card"
            hidden
        >
            <h2 id="articleFormTitle">Nuovo articolo</h2>

            <form id="articleForm" class="auth-form">
                <div class="form-group">
                    <label for="articleTitle">Titolo</label>

                    <input
                        id="articleTitle"
                        name="titolo"
                        type="text"
                        minlength="5"
                        maxlength="200"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="articleCategory">
                        Categoria (facoltativa)
                    </label>

                    <input
                        id="articleCategory"
                        name="categoria"
                        type="text"
                        maxlength="100"
                    >
                </div>

                <div class="form-group">
                    <label for="articleContent">Contenuto</label>

                    <textarea
                        id="articleContent"
                        name="contenuto"
                        rows="6"
                        minlength="10"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="articlePublished">
                        <input
                            id="articlePublished"
                            name="pubblicato"
                            type="checkbox"
                            checked
                        >
                        Pubblicato (visibile ai clienti)
                    </label>
                </div>

                <button class="button button-primary" type="submit">
                    Salva articolo
                </button>

                <button
                    id="cancelEditButton"
                    class="button"
                    type="button"
                    hidden
                >
                    Annulla modifica
                </button>
            </form>

            <p id="articleFormMessage" class="form-message" role="status"></p>
        </section>

        <section class="boats-list-section">
            <div class="section-heading">
                <h2>Articoli disponibili</h2>

                <button
                    id="showNewArticleButton"
                    class="button button-primary"
                    type="button"
                    hidden
                >
                    + Nuovo articolo
                </button>
            </div>

            <p id="articlesMessage" class="form-message" role="status"></p>

            <div id="articlesList" class="boats-grid">
                <p>Caricamento degli articoli...</p>
            </div>
        </section>
    </main>

    <script src="js/knowledge-base.js"></script>
</body>

</html>

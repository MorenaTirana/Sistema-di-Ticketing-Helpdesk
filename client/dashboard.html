<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Sistema di Ticketing / Helpdesk</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <a class="brand" href="dashboard.html">
                <span class="brand-logo">TH</span>

                <span class="brand-text">
                    <strong>Ticketing Helpdesk</strong>
                    <small>Area personale</small>
                </span>
            </a>

            <div class="header-actions">
    <div class="notifications-area">
        <button
            id="notificationsButton"
            class="notifications-button"
            type="button"
            aria-label="Apri le notifiche"
        >
            🔔

            <span
                id="notificationsCount"
                class="notifications-count"
                hidden
            >
                0
            </span>
        </button>

        <div
            id="notificationsPanel"
            class="notifications-panel"
            hidden
        >
            <h2>Notifiche</h2>

            <div id="notificationsList">
                <p>Caricamento...</p>
            </div>
        </div>
    </div>

    <button
        id="logoutButton"
        class="button button-small"
        type="button"
    >
        Esci
    </button>
</div>
        </div>
    </header>

    <main class="dashboard-main">
        <section class="dashboard-welcome">
            <p class="eyebrow">Area personale</p>

            <h1>
                Benvenuto,
                <span id="userName">utente</span>
            </h1>

            <p>
                Ruolo:
                <strong id="userRole">-</strong>
            </p>
        </section>

        <section class="features-grid">
             <a class="feature-card" href="new-ticket.html">
                <span class="feature-icon">＋</span>
                
                <h2>Nuovo ticket</h2>
                <p>
                    Apri una nuova richiesta di assistenza.
                </p>
            </a>

            <a class="feature-card" href="tickets.html">
                <span class="feature-icon">◎</span>
                <h2>I miei ticket</h2>
                <p>
                    Consulta le richieste già inviate.
                </p>
            </a>

            <a
                id="boatsCard" 
                class="feature-card"
                href="boats.html"
            >
                <span class="feature-icon">◇</span>

                <h2 id="boatsCardTitle">Le mie barche</h2>

                <p id="boatsCardDescription">
                    Registra e consulta le tue imbarcazioni.
                </p>
            </a>
        </section>

        <p id="message" class="form-message" role="status"></p>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>

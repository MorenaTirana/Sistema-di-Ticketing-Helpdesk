<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuova password - Ticketing Helpdesk</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
    <main class="auth-layout">
        <section class="auth-introduction">
            <a class="brand" href="index.html">
                <span class="brand-logo">TH</span>

                <span class="brand-text">
                    <strong>Ticketing Helpdesk</strong>
                    <small>Protezione account</small>
                </span>
            </a>

            <div>
                <p class="eyebrow">
                    Nuova password
                </p>

                <h1>
                    Scegli una nuova password.
                </h1>

                <p>
                    Il collegamento può essere utilizzato
                    una sola volta ed è valido per 30 minuti.
                </p>
            </div>
        </section>

        <section class="auth-card">
            <p class="eyebrow">
                Reimpostazione
            </p>

            <h2>Inserisci la nuova password</h2>

            <form id="resetPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="nuovaPassword">
                        Nuova password
                    </label>

                    <input id="nuovaPassword" name="nuova_password" type="password" minlength="8"
                        autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="confermaPassword">
                        Conferma nuova password
                    </label>

                    <input id="confermaPassword" name="conferma_password" type="password" minlength="8"
                        autocomplete="new-password" required>
                </div>

                <button id="submitButton" class="button button-primary" type="submit">
                    Salva nuova password
                </button>
            </form>

            <p id="message" class="form-message" role="status"></p>

            <p class="auth-switch">
                <a href="login.html">
                    Torna al login
                </a>
            </p>
        </section>
    </main>

    <script src="js/reset-password.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Accesso - Ticketing Helpdesk</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <!-- VIDEO DI SFONDO -->
    <div class="auth-background" aria-hidden="true">
        <video
            class="auth-background-video"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
        >
            <source
                src="assets/login-background.mp4"
                type="video/mp4"
            >
        </video>

        <div class="auth-background-overlay"></div>
    </div>

    <!-- HEADER -->
 <header class="site-header auth-header">
    <div class="header-container">

        <div class="login-brand">

            <a
                class="minimal-brand"
                href="index.html"
                aria-label="Sessa Marine"
            >
                <img
                    src="assets/logo-sessa.png"
                    alt="Sessa Marine"
                >
            </a>

            <span class="login-brand-divider"></span>

            <div class="login-page-title">
                <strong>Customer Service </strong>
                
            </div>

        </div>

        <a
            class="home-icon-button"
            href="index.html"
            aria-label="Torna alla pagina principale"
            data-tooltip="Pagina principale"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M3 10.8 12 3l9 7.8"
                ></path>

                <path
                    d="M5.5 9.5V21h13V9.5"
                ></path>

                <path
                    d="M9.5 21v-6h5v6"
                ></path>
            </svg>
        </a>

    </div>
</header>

    <!-- CONTENUTO PRINCIPALE -->
    <main class="auth-main">
        <section class="auth-layout">

            <!-- TESTO A SINISTRA -->
            <div class="auth-information">
               

                <h1>
                    Assistenza,<br>
                    sempre a bordo.
                </h1>

                <p class="auth-description">
                    Accedi per gestire le tue richieste.
                </p>

            </div>

            <!-- MODULO LOGIN -->
           <div class="auth-card">

    <div class="auth-card-heading">
        <h2>Accedi</h2>
    </div>

    <form id="loginForm" class="auth-form">

        <div class="form-group">
            <label for="email">Email</label>

            <div class="auth-input-wrapper">
                <span
                    class="auth-input-icon"
                    aria-hidden="true"
                >
                    @
                </span>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="nome@email.com"
                    required
                    autocomplete="email"
                >
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>

            <div class="auth-input-wrapper">
                <span
                    class="auth-input-icon auth-lock"
                    aria-hidden="true"
                ></span>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required
                    autocomplete="current-password"
                >
            </div>
        </div>

        <a
            class="forgot-password"
            href="forgot-password.html"
        >
            Password dimenticata?
        </a>

        <button
            class="button button-primary button-full"
            type="submit"
        >
            Accedi
        </button>
    </form>

    <p
        id="message"
        class="form-message"
        role="status"
        aria-live="polite"
    ></p>

    <a
        class="auth-register-link"
        href="register.html"
    >
        Crea un account
    </a>

</div>
        </section>
    </main>
   <footer class="auth-footer-bar">
    <p class="minimal-footer-content">
        <strong>Sessa Marine</strong>

        <span aria-hidden="true"></span>

        <span>Customer Care</span>

        <span aria-hidden="true"></span>

        <span>© 2026</span>
    </p>
</footer>

    <script src="js/login.js"></script>
</body>
</html>

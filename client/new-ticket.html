<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuovo ticket - Sistema di Ticketing / Helpdesk</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <a class="brand" href="dashboard.html">
                <span class="brand-logo">TH</span>

                <span class="brand-text">
                    <strong>Ticketing Helpdesk</strong>
                    <small>Nuova richiesta</small>
                </span>
            </a>

            <a class="button button-small" href="dashboard.html">
                Dashboard
            </a>
        </div>
    </header>

    <main class="dashboard-main">
        <section class="dashboard-welcome">
            <p class="eyebrow">Assistenza</p>
            <h1>Apri un nuovo ticket</h1>

            <p>
                Descrivi il problema nel modo più chiaro possibile.
            </p>
        </section>

        <section class="auth-card ticket-form-card">
            <form id="ticketForm" class="auth-form">
                <div class="form-group">
                    <label for="barcaId">Barca interessata</label>

                        <select
                            id="barcaId"
                            name="barca_id"
                            required
                            >
                            <option value="">Caricamento delle barche...</option>
                        </select>

                    <small>
                        La barca non è presente?
                        <a href="boats.html">Registrala qui</a>.
                    </small>
                </div>

                <div class="form-group">
                    <label for="tipoRichiesta">
                        Tipo di richiesta
                    </label>

                    <select
                        id="tipoRichiesta"
                        name="tipo_richiesta"
                        required
                        >
                        <option value="">
                            Seleziona il tipo di richiesta
                        </option>

                        <option value="garanzia">
                            Richiesta di garanzia
                        </option>

                        <option value="ricambi">
                            Acquisto di ricambi
                        </option>

                        <option value="servizio">
                            Intervento o servizio
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="titolo">Titolo</label>

                    <input
                        type="text"
                        id="titolo"
                        name="titolo"
                        placeholder="Breve descrizione del problema"
                        required
                        minlength="5"
                        maxlength="200"
                    >
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria</label>

                    <select
                        id="categoria"
                        name="categoria"
                        required
                    >
                        <option value="">Seleziona una categoria</option>
                        <option value="problema_tecnico">
                            Problema tecnico
                        </option>
                        <option value="accesso_account">
                            Accesso all'account
                        </option>
                        <option value="fatturazione">
                            Fatturazione
                        </option>
                        <option value="informazioni">
                            Richiesta di informazioni
                        </option>
                        <option value="altro">
                            Altro
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descrizione">Descrizione</label>

                    <textarea
                        id="descrizione"
                        name="descrizione"
                        placeholder="Descrivi dettagliatamente la richiesta"
                        required
                        minlength="10"
                        rows="8"
                    ></textarea>
                </div>

                <button 
                    id="submitTicketButton"
                    class="button button-primary" 
                    type="submit">
                        Invia ticket
                </button>
            </form>

            <p id="message" class="form-message" role="status"></p>
        </section>
    </main>

    <script src="js/new-ticket.js"></script>
</body>
</html>

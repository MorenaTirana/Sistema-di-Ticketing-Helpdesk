<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profilo - Ticketing Helpdesk</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <a class="brand" href="dashboard.html">
                <span class="brand-logo">TH</span>

                <span class="brand-text">
                    <strong>Ticketing Helpdesk</strong>
                    <small>Profilo personale</small>
                </span>
            </a>

            <div class="header-actions">
                <a class="button button-small" href="dashboard.html">
                    Dashboard
                </a>

                <button id="logoutButton" class="button button-small" type="button">
                    Esci
                </button>
            </div>
        </div>
    </header>

    <main class="dashboard-main">
        <section class="dashboard-welcome">
            <p class="eyebrow">Account</p>

            <h1>Il mio profilo</h1>

            <p>
                Aggiorna i dati di contatto e la password
                del tuo account.
            </p>
        </section>

        <section class="auth-card ticket-form-card">
            <h2>Dati personali</h2>

            <form id="profileForm" class="auth-form">
                <div class="form-group">
                    <label for="nome">Nome</label>

                    <input id="nome" name="nome" type="text" minlength="2" required>
                </div>

                <div class="form-group">
                    <label for="cognome">Cognome</label>

                    <input id="cognome" name="cognome" type="text" minlength="2" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input id="email" name="email" type="email" required>
                </div>

                <div class="form-group">
                    <label for="telefono">Telefono</label>

                    <input id="telefono" name="telefono" type="tel" minlength="6" maxlength="30" required>
                </div>

                <button class="button button-primary" type="submit">
                    Salva dati
                </button>
            </form>

            <p id="profileMessage" class="form-message" role="status"></p>
        </section>

        <section class="auth-card ticket-form-card">
            <h2>Modifica password</h2>

            <form id="passwordForm" class="auth-form">
                <div class="form-group">
                    <label for="passwordAttuale">
                        Password attuale
                    </label>

                    <input id="passwordAttuale" name="password_attuale" type="password" autocomplete="current-password"
                        required>
                </div>

                <div class="form-group">
                    <label for="nuovaPassword">
                        Nuova password
                    </label>

                    <input id="nuovaPassword" name="nuova_password" type="password" minlength="8"
                        autocomplete="new-password" required>
                </div>

                <div class="form-group">
                    <label for="confermaPassword">
                        Conferma nuova password
                    </label>

                    <input id="confermaPassword" name="conferma_password" type="password" minlength="8"
                        autocomplete="new-password" required>
                </div>

                <button class="button button-primary" type="submit">
                    Modifica password
                </button>
            </form>

            <p id="passwordMessage" class="form-message" role="status"></p>
        </section>
    </main>

    <script src="js/profile.js"></script>
</body>

</html>
